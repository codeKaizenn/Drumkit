<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="drumkit.css">
</head>
<body>
    <div class="Drumpad">
        <div class="pad" data-key="A" data-sound="Crash">
            <img src="icons/crash.png" alt="Crash Cymbal">
        </div>
        <div class="pad" data-key="S" data-sound="tomb">
            <img src="icons/snare.png" alt="Snare Drum">
        </div>
        <div class="pad" data-key="D" data-sound="closehihat">
            <img src="icons/closed-hihat.png" alt="Closed Hi-Hat">
        </div>
        <div class="pad" data-key="F" data-sound="kick">
            <img src="icons/kick.png" alt="Kick Drum">
        </div>
        <div class="pad" data-key="J" data-sound="Snare">
            <img src="icons/snare.png" alt="Snare Drum 2">
        </div>
        <div class="pad" data-key="K" data-sound="openhihat">
            <img src="icons/open-hihat.png" alt="Open Hi-Hat">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script> <script src="index.js"></script>
</body>
</html>
